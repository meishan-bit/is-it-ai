# When you push a tag like v1.1.0 (app) or content-v1.1.0 (content), GitHub creates a Release for it.
name: Release

on:
  push:
    tags: ['v*', 'content-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release made by hand on GitHub also creates the tag, which triggers this workflow.
          # Skip in that case instead of failing with "tag_name already exists".
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists (probably created by hand). Nothing to do."
            exit 0
          fi
          gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
