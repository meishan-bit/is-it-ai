# When you push a tag like v1.1.0 (app) or content-v1.1.0 (content), GitHub creates a Release for it.
name: Release

on:
  push:
    tags: ['v*', 'content-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes
